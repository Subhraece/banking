    <style>
        :root {
            --navy:      #14213D;
            --navy-deep: #0B1526;
            --navy-mid:  #1D2E52;
            --gold:      #C89B3C;
            --gold-soft: rgba(200,155,60,0.12);
            --paper:     #F7F1E3;
            --border:    rgba(255,255,255,0.08);
            --ink-faint: rgba(247,241,227,0.45);
            --surface:   #FAFAF8;
            --font: 'IBM Plex Sans Bengali', 'IBM Plex Sans', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            font-family: var(--font);
            background: var(--navy-deep);
            overflow: hidden;
        }

        body.lang-bn { font-family: 'IBM Plex Sans Bengali', var(--font); }

        /* ── Shell ── */
        .mm-shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* ── Header bar (matches calc-header-bar) ── */
        .mm-header {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 22px;
            background: var(--navy);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .mm-brand {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .mm-eyebrow {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--gold);
            font-weight: 600;
        }
        .mm-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--paper);
            line-height: 1.2;
        }

        /* ── Controls panel ── */
        .mm-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .mm-hint {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            color: var(--ink-faint);
            padding: 6px 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 7px;
        }
        .mm-hint svg { width: 14px; height: 14px; flex-shrink: 0; }

        .mm-reset-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(247,241,227,0.18);
            background: rgba(255,255,255,0.05);
            color: rgba(247,241,227,0.75);
            font-family: var(--font);
            font-size: 12px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 7px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .mm-reset-btn:hover {
            background: rgba(200,155,60,0.12);
            color: var(--gold);
            border-color: rgba(200,155,60,0.3);
        }
        .mm-reset-btn svg { width: 14px; height: 14px; }

        /* ── Canvas ── */
        #mindmap-container {
            flex: 1;
            cursor: grab;
            background: var(--navy-deep);
            background-image:
                radial-gradient(circle at 15% 20%, rgba(200,155,60,0.04), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(29,46,82,0.6), transparent 45%);
        }
        #mindmap-container:active { cursor: grabbing; }

        /* ── D3 nodes ── */
        .node circle {
            fill: var(--navy-mid);
            stroke: var(--gold);
            stroke-width: 2px;
            cursor: pointer;
            transition: fill 0.2s, stroke-width 0.2s;
        }
        .node circle:hover {
            fill: rgba(200,155,60,0.2);
            stroke-width: 3px;
        }
        .node--internal circle {
            fill: var(--navy);
            stroke: var(--gold);
        }
        /* collapsed internal node = gold filled */
        .node text {
            font-size: 13px;
            fill: rgba(247,241,227,0.88);
            font-family: var(--font);
            pointer-events: none;
        }
        .node--internal text { font-weight: 600; fill: var(--paper); }

        .text-bg {
            fill: rgba(11,21,38,0.82);
            stroke: rgba(200,155,60,0.25);
            stroke-width: 1px;
            pointer-events: none;
        }

        .link {
            fill: none;
            stroke: rgba(200,155,60,0.25);
            stroke-width: 1.5px;
            stroke-linecap: round;
        }
    </style>
</head>

                                { name: { en: "Credit & Debit Card Swipe Machine", bn: "ক্রেডিট এবং ডেবিট কার্ড সোয়াইপ মেশিন" } }
                            ]
                        },
                        { name: { en: "Mobile Banking (SMS for all transactions)", bn: "মোবাইল ব্যাংকিং (সব লেনদেনের জন্য এসএমএস)" } },
                        { name: { en: "Locker (For Safety & Security)", bn: "লকার (নিরাপত্তা ও সুরক্ষার জন্য)" } }

        const margin = {top: 20, right: 90, bottom: 30, left: 120};
        const container = document.getElementById('mindmap-container');
        let width  = container.clientWidth  || window.innerWidth;
        let height = container.clientHeight || window.innerHeight;

        const svg = d3.select("#mindmap-container").append("svg")
            .attr("width", width)
            .attr("height", height)
            .attr("viewBox", `0 0 ${width} ${height}`);

        const g = svg.append("g");

        const zoom = d3.zoom()
            .scaleExtent([0.1, 3])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });

        svg.call(zoom);

        const centerTree = () => {
            const transform = d3.zoomIdentity.translate(width / 5, height / 2).scale(0.85);
            svg.transition().duration(750).call(zoom.transform, transform);
        };

        window.addEventListener('resize', () => {
            width  = container.clientWidth  || window.innerWidth;
            height = container.clientHeight || window.innerHeight;
            svg.attr("width", width).attr("height", height)
               .attr("viewBox", `0 0 ${width} ${height}`);
        });

        document.getElementById('reset-btn').addEventListener('click', centerTree);

        let i = 0;
        const duration = 750;
        let root;

        // Increased node spacing to accommodate long text fields from PDF summaries
        const treemap = d3.tree().nodeSize([55, 420]); 

        root = d3.hierarchy(treeData, d => d.children);
        root.x0 = 0;
        root.y0 = 0;

        root.children.forEach(collapse);

        update(root);
        centerTree();

        function collapse(d) {
            if (d.children) {
                d._children = d.children;
                d._children.forEach(collapse);
                d.children = null;
            }
        }

        function update(source) {
            const treeData = treemap(root);
            const nodes = treeData.descendants();
            const links = treeData.descendants().slice(1);

            const node = g.selectAll('g.node')
                .data(nodes, d => d.id || (d.id = ++i));

            const nodeEnter = node.enter().append('g')
                .attr('class', d => `node ${d.children || d._children ? 'node--internal' : 'node--leaf'}`)
                .attr("transform", d => `translate(${source.y0},${source.x0})`)
                .on('click', click);

            nodeEnter.append('rect')
                .attr('class', 'text-bg')
                .style("opacity", 1e-6);

            nodeEnter.append('circle')
                .attr('class', 'node')
                .attr('r', 1e-6)
                .style("fill", d => d._children ? "var(--navy)" : "var(--navy-mid)");

            nodeEnter.append('text')
                .attr("dy", ".35em")
                .attr("x", d => d.children || d._children ? -24 : 24)
                .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                .text(d => d.data.name[currentLang]) 
                .style("fill-opacity", 1e-6);

            const nodeUpdate = nodeEnter.merge(node);

            nodeUpdate.transition()
                .duration(duration)
                .attr("transform", d => `translate(${d.y},${d.x})`);

            nodeUpdate.select('circle.node')
                .attr('r', 8)
                .style("fill", d => d._children ? "var(--gold)" : "var(--navy-mid)")
                .style("stroke", "var(--gold)")
                .attr('cursor', 'pointer');

            nodeUpdate.select('text')
                .text(d => d.data.name[currentLang])
                .style("fill-opacity", 1)
                .attr("x", d => d.children || d._children ? -24 : 24)
                .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                .each(function(d) {
                    d.bbox = this.getBBox(); 
                });

            nodeUpdate.select('rect.text-bg')
                .transition().duration(duration)
                .style("opacity", 1)
                .attr('width', d => d.bbox.width + 20)
                .attr('height', d => d.bbox.height + 12)
                .attr('x', d => d.bbox.x - 10)
                .attr('y', d => d.bbox.y - 6);

            const nodeExit = node.exit().transition()
                .duration(duration)
                .attr("transform", d => `translate(${source.y},${source.x})`)
                .remove();

            nodeExit.select('circle').attr('r', 1e-6);
            nodeExit.select('rect.text-bg').style('opacity', 1e-6);
            nodeExit.select('text').style('fill-opacity', 1e-6);

            const link = g.selectAll('path.link')
                .data(links, d => d.id);

            const diagonal = (s, d) => {
                return `M ${s.y} ${s.x}
                        C ${(s.y + d.y) / 2} ${s.x},
                          ${(s.y + d.y) / 2} ${d.x},
                          ${d.y} ${d.x}`;
            };

            const linkEnter = link.enter().insert('path', "g")
                .attr("class", "link")
                .attr('d', d => {
                    const o = {x: source.x0, y: source.y0};
                    return diagonal(o, o);
                });

            const linkUpdate = linkEnter.merge(link);

            linkUpdate.transition()
                .duration(duration)
                .attr('d', d => diagonal(d, d.parent));

            const linkExit = link.exit().transition()
                .duration(duration)
                .attr('d', d => {
                    const o = {x: source.x, y: source.y};
                    return diagonal(o, o);
                })
                .remove();

            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });
        }

        function click(event, d) {
            if (d.children) {
                d._children = d.children;
                d.children = null;
            } else {
                d.children = d._children;
                d._children = null;
            }
            update(d);
            
            if (d.children) {
                const svgWidth = window.innerWidth;
                const svgHeight = window.innerHeight;
                const scale = d3.zoomTransform(svg.node()).k;
                const x = -d.y * scale + svgWidth / 3; 
                const y = -d.x * scale + svgHeight / 2;
                
                svg.transition().duration(750).call(
                    zoom.transform, 
                    d3.zoomIdentity.translate(x, y).scale(scale)
                );
            }
        }

        // lang-toggle-btn is hidden; language is controlled by parent via postMessage
        // kept for compatibility
        const _legacyBtn = document.getElementById('lang-toggle-btn');
        if (_legacyBtn) _legacyBtn.addEventListener('click', () => {});

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'SET_LANG') {
                currentLang = event.data.lang;
                document.body.className = `w-screen h-screen flex flex-col relative lang-${currentLang}`;
                document.getElementById('ui-title').innerText = uiTranslations[currentLang].title;
                document.getElementById('ui-subtitle').innerText = uiTranslations[currentLang].subtitle;
                document.getElementById('ui-lang-text').innerText = uiTranslations[currentLang].langText;
                document.getElementById('ui-inst-1').innerText = uiTranslations[currentLang].inst1;
                document.getElementById('ui-inst-2').innerText = uiTranslations[currentLang].inst2;
                document.getElementById('reset-btn').innerText = uiTranslations[currentLang].reset;
                update(root);
            }
        });
    </script>
