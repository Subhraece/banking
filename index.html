    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; 
            background-color: #f8fafc; 
        }
        
        body.lang-bn {
            font-family: 'Tiro Bangla', 'Inter', serif;
        }
        
        .node circle {
            fill: #fff;
            stroke: #2563eb; 
            stroke-width: 2.5px;
            cursor: pointer;
            transition: fill 0.2s, stroke-width 0.2s;
        }

        .node circle:hover {
            fill: #eff6ff; 
            stroke-width: 3.5px;
        }

        .node text {
            font-size: 14px;
            fill: #1e293b; 
            pointer-events: none;
        }

        .node--internal text {
            font-weight: 600;
        }

        /* Solid background for highlighting texts */
        .text-bg {
            fill: #ffffff;
            fill-opacity: 1;
            stroke: #94a3b8;
            stroke-width: 1px;
            pointer-events: none;
            rx: 6px;
            ry: 6px;
        }

        .link {
            fill: none;
            stroke: #cbd5e1; 
            stroke-width: 2px;
            stroke-linecap: round;
        }
        
        #mindmap-container {
            cursor: grab;
        }
        #mindmap-container:active {
            cursor: grabbing;
        }
    </style>

                                { name: { en: "Co-operative, Association, Society, Trust", bn: "সমবায়, সমিতি, সোসাইটি, ট্রাস্ট" } },
                                { name: { en: "Section-8 Co., Sangho, Club", bn: "সেকশন-৮ কোম্পানি, সংঘ, ক্লাব" } }
                            ]
                        },
                        {
                            name: { en: "Required Business Licenses", bn: "প্রয়োজনীয় ব্যবসার লাইসেন্স" },
                            children: [
                                { 
                                    name: { en: "Proprietorship (State Govt.)", bn: "মালিকানা ব্যবসা (রাজ্য সরকার)" }, 
                                    children: [
                                        { name: { en: "Trade License from Panchayat/Municipality/Corporation", bn: "পঞ্চায়েত/পৌরসভা/কর্পোরেশন থেকে ট্রেড লাইসেন্স" } },
                                        { name: { en: "Business PAN Card & Proprietor KYC Must", bn: "বিজনেস প্যান কার্ড এবং মালিকের কেওয়াইসি আবশ্যক" } }
                                    ] 
                                },
                                { 
                                    name: { en: "Partnership (State Govt.)", bn: "অংশীদারি ব্যবসা (রাজ্য সরকার)" }, 
                                    children: [
                                        { name: { en: "Partnership Deed (Min stamp duty Rs.150/-)", bn: "অংশীদারি দলিল (ন্যূনতম স্ট্যাম্প ডিউটি ১৫০ টাকা)" } },
                                        { name: { en: "Trade License from local governing bodies", bn: "স্থানীয় গভর্নিং বডি থেকে ট্রেড লাইসেন্স" } },
                                        { name: { en: "Business PAN Card & Partners KYC Must", bn: "বিজনেস প্যান কার্ড এবং অংশীদারদের কেওয়াইসি আবশ্যক" } }
                                    ] 
                                },
                                { 
                                    name: { en: "Companies (Central Govt. Recommended)", bn: "কোম্পানি (কেন্দ্রীয় সরকার প্রস্তাবিত)" }, 
                                    children: [
                                        { name: { en: "Incorporation Cert. from Ministry of Corporate Affairs", bn: "কর্পোরেট বিষয়ক মন্ত্রণালয় থেকে ইনকর্পোরেশন সার্টিফিকেট" } },
                                        { name: { en: "MOA (Memorandum) & AOA (Articles of Association)", bn: "এমওএ (মেমোরেন্ডাম) এবং এওএ (আর্টিকেলস অফ অ্যাসোসিয়েশন)" } },
                                        { name: { en: "Trade License & Business PAN Card", bn: "ট্রেড লাইসেন্স এবং বিজনেস প্যান কার্ড" } },
                                        { name: { en: "Directors KYC Must", bn: "পরিচালকদের কেওয়াইসি আবশ্যক" } }
                                    ] 
                                }
                            ]
                        },
                        {
                            name: { en: "Operations & Benefits", bn: "কার্যক্রম এবং সুবিধা" },
                            children: [
                                { name: { en: "Opening Balance: As per Bank/Branch/Location", bn: "খোলার ব্যালেন্স: ব্যাঙ্ক/শাখা/স্থান অনুযায়ী" } },
                                { name: { en: "Benefits: Transaction Statement, Cheque Book", bn: "সুবিধা: লেনদেনের বিবরণী, চেক বই" } },
                                { name: { en: "Digital: QR Code for UPI, Payment Card Swipe Machine", bn: "ডিজিটাল: ইউপিআই পেমেন্টের জন্য কিউআর কোড, পেমেন্ট কার্ড সোয়াইপ মেশিন" } },
                                { name: { en: "Deposit: Organization & Any One", bn: "জমা: সংস্থা এবং যে কেউ" } },
                                { name: { en: "Withdraw: Only Account Holder of Organization", bn: "উত্তোলন: শুধুমাত্র সংস্থার অ্যাকাউন্টধারী" } }
                            ]
                        }
                    ]
                }
            ]
        };

        const margin = {top: 20, right: 90, bottom: 30, left: 120};
        let width = window.innerWidth;
        let height = window.innerHeight;

        const svg = d3.select("#mindmap-container").append("svg")
            .attr("width", width)
            .attr("height", height)
            .attr("viewBox", `0 0 ${width} ${height}`);

        const g = svg.append("g");

        const zoom = d3.zoom()
            .scaleExtent([0.1, 3])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });

        svg.call(zoom);

        const centerTree = () => {
            const transform = d3.zoomIdentity.translate(width / 5, height / 2).scale(0.85);
            svg.transition().duration(750).call(zoom.transform, transform);
        };

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            svg.attr("width", width).attr("height", height)
               .attr("viewBox", `0 0 ${width} ${height}`);
        });

        document.getElementById('reset-btn').addEventListener('click', centerTree);

        let i = 0;
        const duration = 750;
        let root;

        // Increased node spacing to accommodate long text fields from PDF summaries
        const treemap = d3.tree().nodeSize([55, 420]); 

        root = d3.hierarchy(treeData, d => d.children);
        root.x0 = 0;
        root.y0 = 0;

        root.children.forEach(collapse);

        update(root);
        centerTree();

        function collapse(d) {
            if (d.children) {
                d._children = d.children;
                d._children.forEach(collapse);
                d.children = null;
            }
        }

        function update(source) {
            const treeData = treemap(root);
            const nodes = treeData.descendants();
            const links = treeData.descendants().slice(1);

            const node = g.selectAll('g.node')
                .data(nodes, d => d.id || (d.id = ++i));

            const nodeEnter = node.enter().append('g')
                .attr('class', d => `node ${d.children || d._children ? 'node--internal' : 'node--leaf'}`)
                .attr("transform", d => `translate(${source.y0},${source.x0})`)
                .on('click', click);

            nodeEnter.append('rect')
                .attr('class', 'text-bg')
                .style("opacity", 1e-6);

            nodeEnter.append('circle')
                .attr('class', 'node')
                .attr('r', 1e-6)
                .style("fill", d => d._children ? "#3b82f6" : "#fff");

            nodeEnter.append('text')
                .attr("dy", ".35em")
                .attr("x", d => d.children || d._children ? -24 : 24)
                .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                .text(d => d.data.name[currentLang]) 
                .style("fill-opacity", 1e-6);

            const nodeUpdate = nodeEnter.merge(node);

            nodeUpdate.transition()
                .duration(duration)
                .attr("transform", d => `translate(${d.y},${d.x})`);

            nodeUpdate.select('circle.node')
                .attr('r', 8)
                .style("fill", d => d._children ? "#3b82f6" : "#fff")
                .style("stroke", "#2563eb")
                .attr('cursor', 'pointer');

            nodeUpdate.select('text')
                .text(d => d.data.name[currentLang])
                .style("fill-opacity", 1)
                .attr("x", d => d.children || d._children ? -24 : 24)
                .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                .each(function(d) {
                    d.bbox = this.getBBox(); 
                });

            nodeUpdate.select('rect.text-bg')
                .transition().duration(duration)
                .style("opacity", 1)
                .attr('width', d => d.bbox.width + 20)
                .attr('height', d => d.bbox.height + 12)
                .attr('x', d => d.bbox.x - 10)
                .attr('y', d => d.bbox.y - 6);

            const nodeExit = node.exit().transition()
                .duration(duration)
                .attr("transform", d => `translate(${source.y},${source.x})`)
                .remove();

            nodeExit.select('circle').attr('r', 1e-6);
            nodeExit.select('rect.text-bg').style('opacity', 1e-6);
            nodeExit.select('text').style('fill-opacity', 1e-6);

            const link = g.selectAll('path.link')
                .data(links, d => d.id);

            const diagonal = (s, d) => {
                return `M ${s.y} ${s.x}
                        C ${(s.y + d.y) / 2} ${s.x},
                          ${(s.y + d.y) / 2} ${d.x},
                          ${d.y} ${d.x}`;
            };

            const linkEnter = link.enter().insert('path', "g")
                .attr("class", "link")
                .attr('d', d => {
                    const o = {x: source.x0, y: source.y0};
                    return diagonal(o, o);
                });

            const linkUpdate = linkEnter.merge(link);

            linkUpdate.transition()
                .duration(duration)
                .attr('d', d => diagonal(d, d.parent));

            const linkExit = link.exit().transition()
                .duration(duration)
                .attr('d', d => {
                    const o = {x: source.x, y: source.y};
                    return diagonal(o, o);
                })
                .remove();

            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });
        }

        function click(event, d) {
            if (d.children) {
                d._children = d.children;
                d.children = null;
            } else {
                d.children = d._children;
                d._children = null;
            }
            update(d);
            
            if (d.children) {
                const svgWidth = window.innerWidth;
                const svgHeight = window.innerHeight;
                const scale = d3.zoomTransform(svg.node()).k;
                const x = -d.y * scale + svgWidth / 3; 
                const y = -d.x * scale + svgHeight / 2;
                
                svg.transition().duration(750).call(
                    zoom.transform, 
                    d3.zoomIdentity.translate(x, y).scale(scale)
                );
            }
        }

        document.getElementById('lang-toggle-btn').addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'bn' : 'en';
            
            document.body.className = `w-screen h-screen flex flex-col relative lang-${currentLang}`;

            document.getElementById('ui-title').innerText = uiTranslations[currentLang].title;
            document.getElementById('ui-subtitle').innerText = uiTranslations[currentLang].subtitle;
            document.getElementById('ui-lang-text').innerText = uiTranslations[currentLang].langText;
            document.getElementById('ui-inst-1').innerText = uiTranslations[currentLang].inst1;
            document.getElementById('ui-inst-2').innerText = uiTranslations[currentLang].inst2;
            document.getElementById('reset-btn').innerText = uiTranslations[currentLang].reset;

            update(root);
        });

    </script>
</body>
</html>
