<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Banking Executive - Interactive Mindmap</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; 
            background-color: #f8fafc; 
        }
        
        /* Apply Bengali font when active */
        body.lang-bn {
            font-family: 'Tiro Bangla', 'Inter', serif;
        }
        
        .node circle {
            fill: #fff;
            stroke: #2563eb; 
            stroke-width: 2.5px;
            cursor: pointer;
            transition: fill 0.2s, stroke-width 0.2s;
        }

        .node circle:hover {
            fill: #eff6ff; 
            stroke-width: 3.5px;
        }

        .node text {
            font-size: 14px;
            fill: #1e293b; 
            pointer-events: none;
        }

        .node--internal text {
            font-weight: 600;
        }

        /* Solid background for highlighting texts */
        .text-bg {
            fill: #ffffff;
            fill-opacity: 1; /* Solid background as requested */
            stroke: #94a3b8; /* Slightly darker slate border */
            stroke-width: 1px;
            pointer-events: none;
            rx: 6px; /* Rounded corners */
            ry: 6px;
        }

        .link {
            fill: none;
            stroke: #cbd5e1; 
            stroke-width: 2px;
            stroke-linecap: round;
        }
        
        #mindmap-container {
            cursor: grab;
        }
        #mindmap-container:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col relative lang-en">

    <!-- Header / UI Controls -->
    <header class="absolute top-0 left-0 w-full p-4 md:p-6 flex flex-col md:flex-row justify-between items-start md:items-start pointer-events-none z-10 gap-4">
        
        <!-- Title & Language Toggle Section -->
        <div class="pointer-events-auto bg-white/95 backdrop-blur-sm p-4 rounded-xl shadow-lg border border-slate-200 flex flex-col gap-4 max-w-sm">
            <div>
                <h1 id="ui-title" class="text-xl md:text-2xl font-bold text-slate-800">Branch Banking Executive</h1>
                <p id="ui-subtitle" class="text-sm text-slate-500 font-medium mt-1">Interactive Curriculum Mindmap</p>
            </div>
            <button id="lang-toggle-btn" class="py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-colors shadow-sm flex items-center justify-center gap-2 w-full">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
                <span id="ui-lang-text">Switch to বাংলা</span>
            </button>
        </div>
        
        <!-- Instructions Section -->
        <div class="pointer-events-auto bg-white/95 backdrop-blur-sm p-4 rounded-xl shadow-lg border border-slate-200 flex flex-col gap-3 text-sm text-slate-700 font-medium max-w-xs">
            <div class="flex items-start gap-3">
                <span class="w-4 h-4 rounded-full border-2 border-blue-600 flex items-center justify-center bg-blue-600 mt-0.5 shrink-0"></span>
                <span id="ui-inst-1">Click nodes to expand/collapse</span>
            </div>
            <div class="flex items-start gap-3">
                <svg class="w-4 h-4 text-slate-500 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                <span id="ui-inst-2">Scroll to zoom, drag to pan</span>
            </div>
            <button id="reset-btn" class="mt-1 w-full py-2 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg transition-colors border border-slate-300">
                Reset View
            </button>
        </div>
    </header>

    <!-- D3 Container -->
    <main id="mindmap-container" class="flex-1 w-full h-full bg-slate-50"></main>

    <script>
        // State for current language
        let currentLang = 'en';

        // UI Translations
        const uiTranslations = {
            en: {
                title: "Branch Banking Executive",
                subtitle: "Interactive Curriculum Mindmap",
                langText: "Switch to বাংলা",
                inst1: "Click nodes to expand/collapse",
                inst2: "Scroll to zoom, drag to pan",
                reset: "Reset View"
            },
            bn: {
                title: "শাখা ব্যাংকিং নির্বাহী",
                subtitle: "ইন্টারেক্টিভ পাঠ্যক্রম মাইন্ডম্যাপ",
                langText: "Switch to English",
                inst1: "প্রসারিত/সঙ্কুচিত করতে নোডগুলিতে ক্লিক করুন",
                inst2: "জুম করতে স্ক্রোল করুন, প্যান করতে টেনে আনুন",
                reset: "ভিউ রিসেট করুন"
            }
        };

        // Data structure with English and Bengali translations
        const treeData = {
            name: { en: "Branch Banking Executive", bn: "শাখা ব্যাংকিং নির্বাহী" },
            children: [
                {
                    name: { en: "Foundational Knowledge", bn: "মৌলিক জ্ঞান" },
                    children: [
                        { name: { en: "Evolution of Banking", bn: "ব্যাংকিং এর বিবর্তন" }, children: [{name: { en: "History and development", bn: "ইতিহাস ও বিকাশ" }}] },
                        { name: { en: "Macro-environment", bn: "ম্যাক্রো-পরিবেশ" }, children: [{name: { en: "Economic factors affecting banking", bn: "ব্যাংকিংকে প্রভাবিত করার অর্থনৈতিক কারণ" }}] },
                        { name: { en: "Entities & Regulators", bn: "সত্তা এবং নিয়ন্ত্রক" }, children: [{name: { en: "Types of institutions (RBI, etc.)", bn: "প্রতিষ্ঠানের ধরন (আরবিআই, ইত্যাদি)" }}, {name: { en: "Regulatory frameworks", bn: "নিয়ন্ত্রক কাঠামো" }}] },
                        { name: { en: "Banking Terminology", bn: "ব্যাংকিং পরিভাষা" }, children: [{name: { en: "Key definitions and concepts", bn: "মূল সংজ্ঞা এবং ধারণা" }}] },
                        { name: { en: "Principles of Banking", bn: "ব্যাংকিং এর নীতি" }, children: [{name: { en: "Core concepts and ethics", bn: "মূল ধারণা এবং নীতিশাস্ত্র" }}] },
                        { name: { en: "Modern Banking Features", bn: "আধুনিক ব্যাংকিং বৈশিষ্ট্য" }, children: [{name: { en: "Technology, convenience, new services", bn: "প্রযুক্তি, সুবিধা, নতুন পরিষেবা" }}] }
                    ]
                },
                {
                    name: { en: "Legal & Regulatory", bn: "আইনি ও নিয়ন্ত্রক কাঠামো" },
                    children: [
                        { name: { en: "Negotiable Instruments Act", bn: "হস্তান্তরযোগ্য দলিল আইন" }, children: [{name: { en: "Key provisions and implications", bn: "মূল বিধান এবং প্রভাব" }}] },
                        { name: { en: "KYC (Know Your Customer)", bn: "কেওয়াইসি (গ্রাহককে জানুন)" }, children: [{name: { en: "Implications and importance", bn: "প্রভাব এবং গুরুত্ব" }}, {name: { en: "Compliance procedures", bn: "কমপ্লায়েন্স পদ্ধতি" }}] }
                    ]
                },
                {
                    name: { en: "Financial Instruments", bn: "আর্থিক উপকরণ" },
                    children: [
                        { name: { en: "Checks/Cheques", bn: "চেক" } },
                        { name: { en: "Bills of Exchange", bn: "বিনিময় বিল" } },
                        { name: { en: "Promissory Notes", bn: "প্রমিসরি নোট (অঙ্গীকারপত্র)" } },
                        { name: { en: "Demand Drafts (DD)", bn: "ডিমান্ড ড্রাফট (ডিডি)" } },
                        { name: { en: "Pay Orders", bn: "পে অর্ডার" } }
                    ]
                },
                {
                    name: { en: "Products & Operations", bn: "পণ্য এবং কার্যক্রম" },
                    children: [
                        { name: { en: "Products & Services Overview", bn: "পণ্য ও পরিষেবাগুলির ওভারভিউ" }, children: [{name: { en: "Accounts, loans, cards, etc.", bn: "অ্যাকাউন্ট, ঋণ, কার্ড, ইত্যাদি" }}] },
                        { name: { en: "Account Opening Procedure", bn: "অ্যাকাউন্ট খোলার পদ্ধতি" }, children: [{name: { en: "Step-by-step process", bn: "ধাপে ধাপে প্রক্রিয়া" }}] },
                        { name: { en: "Core Banking Operations", bn: "কোর ব্যাংকিং কার্যক্রম" }, children: [{name: { en: "How core banking systems function", bn: "কোর ব্যাংকিং সিস্টেম কীভাবে কাজ করে" }}] },
                        { name: { en: "Inter-departmental Coordination", bn: "আন্তঃবিভাগীয় সমন্বয়" }, children: [{name: { en: "Workflow between banking units", bn: "ব্যাংকিং ইউনিটগুলির মধ্যে কর্মপ্রবাহ" }}] },
                        { name: { en: "Client Segmentation", bn: "ক্লায়েন্ট বিভাজন" }, children: [{name: { en: "Identifying target clients", bn: "লক্ষ্য গ্রাহকদের চিহ্নিত করা" }}, {name: { en: "Processing client requests", bn: "গ্রাহকদের অনুরোধ প্রক্রিয়াকরণ" }}] }
                    ]
                },
                {
                    name: { en: "Risk & Security", bn: "ঝুঁকি এবং নিরাপত্তা" },
                    children: [
                        { name: { en: "Cyber Security in Internet Banking", bn: "ইন্টারনেট ব্যাংকিংয়ে সাইবার নিরাপত্তা" }, children: [{name: { en: "Do's and Don'ts for secure transactions", bn: "নিরাপদ লেনদেনের জন্য করণীয় এবং বর্জনীয়" }}] },
                        { name: { en: "Risk Management", bn: "ঝুঁকি ব্যবস্থাপনা" }, children: [{name: { en: "Implications of accidents/unforeseen events", bn: "দুর্ঘটনা বা অপ্রত্যাশিত ঘটনার প্রভাব" }}] }
                    ]
                },
                {
                    name: { en: "Job Roles & Responsibilities", bn: "কাজের ভূমিকা এবং দায়িত্ব" },
                    children: [
                        { name: { en: "Teller", bn: "টেলার (ক্যাশিয়ার)" }, children: [{name: { en: "Cash handling, basic transactions", bn: "নগদ পরিচালনা, মৌলিক লেনদেন" }}] },
                        { name: { en: "Customer Service Executive", bn: "গ্রাহক সেবা নির্বাহী" }, children: [{name: { en: "Handling inquiries, resolving issues", bn: "অনুসন্ধান পরিচালনা, সমস্যা সমাধান" }}] },
                        { name: { en: "Operations Executive", bn: "অপারেশনস এক্সিকিউটিভ" }, children: [{name: { en: "Back-office processing, reconciliation", bn: "ব্যাক-অফিস প্রক্রিয়াকরণ, পুনর্মিলন" }}] },
                        { name: { en: "Sales Executive", bn: "বিক্রয় নির্বাহী" }, children: [{name: { en: "Promoting products, acquiring customers", bn: "পণ্য প্রচার, গ্রাহক অর্জন" }}] }
                    ]
                }
            ]
        };

        // Set dimensions and margins for the diagram
        const margin = {top: 20, right: 90, bottom: 30, left: 120};
        let width = window.innerWidth;
        let height = window.innerHeight;

        // Append the svg object to the container
        const svg = d3.select("#mindmap-container").append("svg")
            .attr("width", width)
            .attr("height", height)
            .attr("viewBox", `0 0 ${width} ${height}`);

        const g = svg.append("g");

        // Set up zoom and pan behavior
        const zoom = d3.zoom()
            .scaleExtent([0.1, 3])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });

        svg.call(zoom);

        // Center function
        const centerTree = () => {
            const transform = d3.zoomIdentity.translate(width / 5, height / 2).scale(0.85);
            svg.transition().duration(750).call(zoom.transform, transform);
        };

        // Handle window resize
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            svg.attr("width", width).attr("height", height)
               .attr("viewBox", `0 0 ${width} ${height}`);
        });

        document.getElementById('reset-btn').addEventListener('click', centerTree);

        let i = 0;
        const duration = 750;
        let root;

        // The node separation logic
        const treemap = d3.tree().nodeSize([50, 350]); // Spaced out for better readability

        // Assigns parent, children, height, depth
        root = d3.hierarchy(treeData, d => d.children);
        root.x0 = 0;
        root.y0 = 0;

        // Collapse nodes deeper than level 1 on initial load
        root.children.forEach(collapse);

        update(root);
        centerTree(); // Initial centering

        // Collapse the node and all it's children
        function collapse(d) {
            if (d.children) {
                d._children = d.children;
                d._children.forEach(collapse);
                d.children = null;
            }
        }

        function update(source) {
            // Assigns the x and y position for the nodes
            const treeData = treemap(root);

            // Compute the new tree layout
            const nodes = treeData.descendants();
            const links = treeData.descendants().slice(1);

            // ****************** Nodes section ***************************

            // Update the nodes...
            const node = g.selectAll('g.node')
                .data(nodes, d => d.id || (d.id = ++i));

            // Enter any new nodes at the parent's previous position.
            const nodeEnter = node.enter().append('g')
                .attr('class', d => `node ${d.children || d._children ? 'node--internal' : 'node--leaf'}`)
                .attr("transform", d => `translate(${source.y0},${source.x0})`)
                .on('click', click);

            // Add background rect for text first so it renders behind text
            nodeEnter.append('rect')
                .attr('class', 'text-bg')
                .style("opacity", 1e-6);

            // Add Circle for the nodes
            nodeEnter.append('circle')
                .attr('class', 'node')
                .attr('r', 1e-6)
                .style("fill", d => d._children ? "#3b82f6" : "#fff");

            // Add labels for the nodes
            nodeEnter.append('text')
                .attr("dy", ".35em")
                .attr("x", d => d.children || d._children ? -24 : 24)
                .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                .text(d => d.data.name[currentLang]) // Use current language
                .style("fill-opacity", 1e-6);

            // UPDATE
            const nodeUpdate = nodeEnter.merge(node);

            // Transition to the proper position for the node
            nodeUpdate.transition()
                .duration(duration)
                .attr("transform", d => `translate(${d.y},${d.x})`);

            // Update the node attributes and style
            nodeUpdate.select('circle.node')
                .attr('r', 8)
                .style("fill", d => d._children ? "#3b82f6" : "#fff")
                .style("stroke", "#2563eb")
                .attr('cursor', 'pointer');

            // Update text to match current language and calculate new size
            nodeUpdate.select('text')
                .text(d => d.data.name[currentLang])
                .style("fill-opacity", 1)
                .attr("x", d => d.children || d._children ? -24 : 24)
                .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                .each(function(d) {
                    // Recalculate bounding box every update for dynamic language sizes
                    d.bbox = this.getBBox(); 
                });

            // Update the solid background rect based on calculated text dimensions
            nodeUpdate.select('rect.text-bg')
                .transition().duration(duration) // Smoothly resize the background!
                .style("opacity", 1)
                .attr('width', d => d.bbox.width + 20)
                .attr('height', d => d.bbox.height + 12)
                .attr('x', d => d.bbox.x - 10)
                .attr('y', d => d.bbox.y - 6);

            // Remove any exiting nodes
            const nodeExit = node.exit().transition()
                .duration(duration)
                .attr("transform", d => `translate(${source.y},${source.x})`)
                .remove();

            // On exit reduce the node circles size to 0
            nodeExit.select('circle')
                .attr('r', 1e-6);
                
            // On exit reduce the opacity of background rect
            nodeExit.select('rect.text-bg')
                .style('opacity', 1e-6);

            // On exit reduce the opacity of text labels
            nodeExit.select('text')
                .style('fill-opacity', 1e-6);

            // ****************** links section ***************************

            // Update the links...
            const link = g.selectAll('path.link')
                .data(links, d => d.id);

            // Creates a curved (diagonal) path from parent to the child nodes
            const diagonal = (s, d) => {
                return `M ${s.y} ${s.x}
                        C ${(s.y + d.y) / 2} ${s.x},
                          ${(s.y + d.y) / 2} ${d.x},
                          ${d.y} ${d.x}`;
            };

            // Enter any new links at the parent's previous position.
            const linkEnter = link.enter().insert('path', "g")
                .attr("class", "link")
                .attr('d', d => {
                    const o = {x: source.x0, y: source.y0};
                    return diagonal(o, o);
                });

            // UPDATE
            const linkUpdate = linkEnter.merge(link);

            // Transition back to the parent element position
            linkUpdate.transition()
                .duration(duration)
                .attr('d', d => diagonal(d, d.parent));

            // Remove any exiting links
            const linkExit = link.exit().transition()
                .duration(duration)
                .attr('d', d => {
                    const o = {x: source.x, y: source.y};
                    return diagonal(o, o);
                })
                .remove();

            // Store the old positions for transition.
            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });
        }

        // Toggle children on click.
        function click(event, d) {
            if (d.children) {
                d._children = d.children;
                d.children = null;
            } else {
                d.children = d._children;
                d._children = null;
            }
            update(d);
            
            // Gently pan to center the clicked node if expanded
            if (d.children) {
                const svgWidth = window.innerWidth;
                const svgHeight = window.innerHeight;
                const scale = d3.zoomTransform(svg.node()).k;
                // Add a small offset to keep it slightly on the left side
                const x = -d.y * scale + svgWidth / 3; 
                const y = -d.x * scale + svgHeight / 2;
                
                svg.transition().duration(750).call(
                    zoom.transform, 
                    d3.zoomIdentity.translate(x, y).scale(scale)
                );
            }
        }

        // Language Toggle Logic
        document.getElementById('lang-toggle-btn').addEventListener('click', () => {
            // Swap Language
            currentLang = currentLang === 'en' ? 'bn' : 'en';
            
            // Update Body Class for Font Handling
            document.body.className = `w-screen h-screen flex flex-col relative lang-${currentLang}`;

            // Update UI Texts
            document.getElementById('ui-title').innerText = uiTranslations[currentLang].title;
            document.getElementById('ui-subtitle').innerText = uiTranslations[currentLang].subtitle;
            document.getElementById('ui-lang-text').innerText = uiTranslations[currentLang].langText;
            document.getElementById('ui-inst-1').innerText = uiTranslations[currentLang].inst1;
            document.getElementById('ui-inst-2').innerText = uiTranslations[currentLang].inst2;
            document.getElementById('reset-btn').innerText = uiTranslations[currentLang].reset;

            // Re-render D3 Nodes
            // Calling update on root recalculates all text labels and bounding boxes!
            update(root);
        });

    </script>
</body>
</html>
